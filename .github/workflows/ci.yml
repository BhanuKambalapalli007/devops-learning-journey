name: DevOps Learning Repo — CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Print pipeline context
        run: |
          echo "================================================"
          echo " Triggered by: ${{ github.event_name }}"
          echo " Branch:       ${{ github.ref_name }}"
          echo " Commit:       ${{ github.sha }}"
          echo " Author:       ${{ github.actor }}"
          echo "================================================"

      - name: Check all phase folders exist
        run: |
          echo "Checking required phase folders..."
          REQUIRED=(
            "phase-01-git"
            "phase-02-docker"
            "phase-03-cicd"
            "phase-04-aws"
            "phase-05-terraform"
            "phase-06-kubernetes"
            "phase-07-monitoring"
          )
          FAILED=0
          for dir in "${REQUIRED[@]}"; do
            if [ -d "$dir" ]; then
              echo "  ✅ $dir"
            else
              echo "  ❌ MISSING: $dir"
              FAILED=1
            fi
          done
          [ $FAILED -eq 0 ] && echo "All 7 phase folders present" || exit 1

      - name: Check every phase has a README
        run: |
          echo "Checking README.md in each phase folder..."
          FAILED=0
          for dir in phase-*/; do
            if [ -f "${dir}README.md" ]; then
              echo "  ✅ ${dir}README.md"
            else
              echo "  ❌ MISSING: ${dir}README.md"
              FAILED=1
            fi
          done
          [ $FAILED -eq 0 ] && echo "All READMEs present" || exit 1

      - name: Check for unresolved TODOs
        run: |
          echo "Scanning for TODO/FIXME in project files..."
          FOUND=$(find . -name "*.md" \
                  -not -path "./.git/*" \
                  -not -name "*reference*" \
                  -not -name "*notes*" \
                  -not -name "*summary*" \
                  | xargs grep -l "TODO\|FIXME" 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "❌ Unresolved TODO/FIXME found in:"
            echo "$FOUND"
            exit 1
          fi
          echo "  ✅ No unresolved TODOs found"

      - name: Check reference documents exist
        run: |
          echo "Checking Git reference documents..."
          REFS=(
            "phase-01-git/git-week1-reference.md"
            "phase-01-git/git-week2-reference.md"
            "phase-01-git/git-week3-reference.md"
          )
          FAILED=0
          for ref in "${REFS[@]}"; do
            if [ -f "$ref" ]; then
              echo "  ✅ $ref"
            else
              echo "  ❌ MISSING: $ref"
              FAILED=1
            fi
          done
          [ $FAILED -eq 0 ] && echo "All reference docs present" || exit 1

      - name: Repository statistics
        run: |
          MD_COUNT=$(find . -name "*.md" -not -path "./.git/*" | wc -l)
          PHASE_COUNT=$(ls -d phase-*/ 2>/dev/null | wc -l)
          TOTAL_LINES=$(find . -name "*.md" -not -path "./.git/*" \
                        -exec wc -l {} + | tail -1 | awk '{print $1}')
          echo "================================================"
          echo " 📁 Phase folders:   $PHASE_COUNT / 7"
          echo " 📚 Markdown files:  $MD_COUNT"
          echo " 📝 Total lines:     $TOTAL_LINES"
          echo " ✅ CI pipeline PASSED — repo is portfolio ready"
          echo "================================================"
