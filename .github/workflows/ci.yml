name: DevOps Learning Repo — CI Pipeline

# Trigger: run on every push and PR to main or develop
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code onto the runner machine
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Show what triggered this run
      - name: Print pipeline context
        run: |
          echo "================================================"
          echo " Triggered by: ${{ github.event_name }}"
          echo " Branch:       ${{ github.ref_name }}"
          echo " Commit:       ${{ github.sha }}"
          echo " Author:       ${{ github.actor }}"
          echo "================================================"

      # Step 3: Validate all required phase folders exist
      - name: Check phase folder structure
        run: |
          echo "Checking required phase folders..."
          REQUIRED=(
            "phase-01-git"
            "phase-02-docker"
            "phase-03-cicd"
            "phase-04-aws"
          )
          FAILED=0
          for dir in "${REQUIRED[@]}"; do
            if [ -d "$dir" ]; then
              echo "  ✅ $dir"
            else
              echo "  ❌ MISSING: $dir"
              FAILED=1
            fi
          done
          [ $FAILED -eq 0 ] && echo "All phase folders present" || exit 1

      # Step 4: Check every phase folder has a README
      - name: Check phase READMEs exist
        run: |
          echo "Checking README.md in each phase folder..."
          FAILED=0
          for dir in phase-*/; do
            if [ -f "${dir}README.md" ]; then
              echo "  ✅ ${dir}README.md"
            else
              echo "  ❌ MISSING: ${dir}README.md"
              FAILED=1
            fi
          done
          [ $FAILED -eq 0 ] && echo "All READMEs present" || exit 1

      # Step 5: Block TODO/FIXME left in markdown files
      - name: Check for unresolved TODOs
        run: |
          echo "Scanning for TODO/FIXME in markdown files..."
          FOUND=$(grep -r "TODO\|FIXME" --include="*.md" . \
                  --exclude-dir=".git" -l 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "❌ Unresolved TODO/FIXME found in:"
            echo "$FOUND"
            exit 1
          fi
          echo "  ✅ No unresolved TODOs found"

      # Step 6: Count and report markdown files
      - name: Repository statistics
        run: |
          MD_COUNT=$(find . -name "*.md" -not -path "./.git/*" | wc -l)
          TOTAL_LINES=$(find . -name "*.md" -not -path "./.git/*" \
                        -exec wc -l {} + | tail -1 | awk '{print $1}')
          echo "================================================"
          echo " 📚 Markdown files:  $MD_COUNT"
          echo " 📝 Total lines:     $TOTAL_LINES"
          echo " ✅ CI pipeline PASSED"
          echo "================================================"
